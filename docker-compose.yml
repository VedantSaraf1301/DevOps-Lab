version: '3.8'

services:
  server:
    build:
      context: ./server
    image: vedantsaraf787/inkwell-server:latest
    container_name: inkwell-server
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=${MONGO_URI}
    restart: unless-stopped

  client:
    build:
      context: ./client
    image: vedantsaraf787/inkwell-client:latest
    container_name: inkwell-client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: unless-stopped
